<svg xmlns="http://www.w3.org/2000/svg" width="420" height="128" viewBox="0 0 420 128" role="img" aria-label="Most played tracks over the last 7 days">
  <style>
    :root {
      --bg: #ffffff; --border: #d0d7de; --fg: #1f2328;
      --sub: #59636e; --accent: #cc0000; --muted-bg: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --border: #30363d; --fg: #e6edf3;
        --sub: #8b949e; --accent: #ff4444; --muted-bg: #21262d;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .head { font-size: 11px; font-weight: 700; fill: var(--accent); letter-spacing: .09em; }
    .rank { font-size: 13px; font-weight: 700; fill: var(--sub); }
    .title { font-size: 12.5px; font-weight: 600; fill: var(--fg); }
    .artist { font-size: 11px; fill: var(--sub); }
    .plays { font-size: 10px; fill: var(--sub); }
    .foot { font-size: 9px; fill: var(--sub); opacity: .75; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="419" height="127" rx="12"/>
  <text x="18" y="28" class="head">MOST PLAYED · LAST 7 DAYS</text>
  <clipPath id="r1"><rect x="40" y="52" width="42" height="42" rx="6"/></clipPath>
  <text x="18" y="78" class="rank">1</text>
  <image x="40" y="52" width="42" height="42" href="data:image/jpeg;base64," clip-path="url(#r1)" preserveAspectRatio="xMidYMid slice"/>
  <text x="94" y="70" class="title">High On You</text>
  <text x="94" y="86" class="artist">Jind Universe</text>
  <rect x="306" y="66" width="96" height="5" rx="2.5" fill="var(--muted-bg)"/>
  <rect x="306" y="66" width="96" height="5" rx="2.5" fill="var(--accent)"/>
  <text x="402" y="86" class="plays" text-anchor="end">1 play</text>
  <text x="18" y="119" class="foot">Sampled every 30 min — approximate</text>
</svg>
