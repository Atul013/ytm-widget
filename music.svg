<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140" role="img" aria-label="Last played on YouTube Music: Rise Above by Orkestral Studio">
  <defs>
    <clipPath id="round">
      <rect x="20" y="20" width="100" height="100" rx="10"/>
    </clipPath>
  </defs>
  <style>
    :root {
      --bg: #ffffff; --border: #d0d7de; --fg: #1f2328;
      --sub: #59636e; --accent: #cc0000; --muted-bg: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --border: #30363d; --fg: #e6edf3;
        --sub: #8b949e; --accent: #ff4444; --muted-bg: #21262d;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font-size: 10px; font-weight: 600; fill: var(--accent); letter-spacing: .08em; }
    .title { font-size: 15px; font-weight: 700; fill: var(--fg); }
    .artist { font-size: 12.5px; fill: var(--sub); }
    .album { font-size: 11px; fill: var(--sub); opacity: .8; }
    .when { font-size: 10.5px; fill: var(--sub); }
    .ph { font-size: 34px; fill: var(--sub); }
  </style>
  <rect class="card" x="0.5" y="0.5" width="419" height="139" rx="12"/>
  <image x="20" y="20" width="100" height="100" href="data:image/jpeg;base64," clip-path="url(#round)" preserveAspectRatio="xMidYMid slice"/>
  <text x="138" y="34" class="label">LAST PLAYED</text>
  <text x="138" y="58" class="title">Rise Above</text>
  <text x="138" y="78" class="artist">Orkestral Studio</text>
  <text x="138" y="98" class="album">Rise Above</text>
  <text x="138" y="118" class="when">just now</text>
</svg>
